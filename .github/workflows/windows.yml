# JaySnr for Windows, built and checked on a real Windows machine in the public repository Narikia1/jaysnr-apps.
# It builds a given commit of the private Narikia1/jaysnr (read with a read-only deploy key), installs the result,
# runs it, and uploads the installer and the evidence. It publishes nothing.
name: Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of Narikia1/jaysnr to build
        required: true

permissions:
  contents: read

concurrency:
  group: windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      EVIDENCE: ${{ github.workspace }}\evidence
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Narikia1/jaysnr
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.JAYSNR_SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generated files are current, and nothing is hardcoded
        run: |
          node scripts/generate.mjs --check
          node scripts/check-hygiene.mjs

      - name: The shared engine as a DLL
        run: cargo build --release --manifest-path engine/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Publish
        run: dotnet publish apps/windows/JaySnr/JaySnr.csproj -r win-x64 -c Release --self-contained

      - name: Keep a copy of ffmpeg, because its dated build is removed after a few weeks
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-pin
          key: ffmpeg-${{ hashFiles('apps/windows/scripts/fetch-ffmpeg.mjs') }}

      - name: Fetch the pinned LGPL ffmpeg
        shell: pwsh
        run: |
          node apps/windows/scripts/fetch-ffmpeg.mjs --out dist/windows/publish --cache "$env:RUNNER_TEMP\ffmpeg-pin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/windows/publish/ffmpeg/ffmpeg.exe)) { throw 'ffmpeg.exe was not fetched' }
          if (-not (Test-Path dist/windows/publish/jaysnr_engine.dll)) { throw 'jaysnr_engine.dll is missing' }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          node apps/windows/scripts/generate-installer.mjs
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -First 1
          & $iscc.FullName apps\windows\installer\jaysnr.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\windows\JaySnr-windows.exe | Format-List FullName, Length

      - name: Install, run, record and keep the evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:EVIDENCE | Out-Null
          Start-Process dist\windows\JaySnr-windows.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER' -Wait
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\JaySnr'
          $exe = Join-Path $installed 'JaySnr.exe'
          if (-not (Test-Path $exe)) { throw 'JaySnr.exe was not installed' }
          & (Join-Path $installed 'ffmpeg\ffmpeg.exe') -hide_banner -encoders 2>&1 | Select-String '264|aac' | Out-File (Join-Path $env:EVIDENCE 'encoders.txt')
          # The status log and a 15-second test recording; both work only together, never in a normal launch.
          $log = Join-Path $env:EVIDENCE 'status.log'
          $env:JAYSNR_STATUS_LOG = $log
          $env:JAYSNR_TEST_RECORD = '15'
          $app = Start-Process $exe -PassThru
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $shot = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shot.Save((Join-Path $env:EVIDENCE $name))
          }
          Start-Sleep -Seconds 14
          Save-Screen 'studio-recording.png'
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not (Select-String -Path $log -Pattern 'recording-saved' -Quiet -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds 2 }
          Save-Screen 'studio.png'
          $running = -not $app.HasExited
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Content $log -ErrorAction SilentlyContinue
          if (-not $running) { throw 'JaySnr closed by itself' }
          $saved = Get-ChildItem (Join-Path ([Environment]::GetFolderPath('MyVideos')) 'JaySnr') -Filter *.mp4 -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $saved) { throw 'No recording was saved' }
          Copy-Item $saved.FullName (Join-Path $env:EVIDENCE 'recording.mp4')
          & (Join-Path $installed 'ffmpeg\ffmpeg.exe') -hide_banner -i $saved.FullName 2>&1 | Select-String 'Duration|Stream' | Out-File (Join-Path $env:EVIDENCE 'recording.txt')
          Get-Content (Join-Path $env:EVIDENCE 'recording.txt')
          if ($saved.Length -lt 200000) { throw "The recording is too small ($($saved.Length) bytes)" }
          # ffmpeg -i without an output ends with code 1; the checks above decide this step.
          exit 0

      - name: Cut a recording short, relaunch, and check it was recovered
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\JaySnr'
          $exe = Join-Path $installed 'JaySnr.exe'
          $ffmpeg = Join-Path $installed 'ffmpeg\ffmpeg.exe'
          $folder = Join-Path ([Environment]::GetFolderPath('MyVideos')) 'JaySnr'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $shot = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shot.Save((Join-Path $env:EVIDENCE $name))
          }
          # The app creates its status log only when it writes the first line, so look for the file before reading it.
          function Wait-Log($log, $pattern, $seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern $pattern -Quiet)) { return $true }
              Start-Sleep -Seconds 1
            }
            return $false
          }
          # A long test recording, ended the way a crash or a power cut would: the encoder and the app killed mid-way.
          $log = Join-Path $env:EVIDENCE 'status-crash.log'
          $env:JAYSNR_STATUS_LOG = $log
          $env:JAYSNR_TEST_RECORD = '300'
          $app = Start-Process $exe -PassThru
          if (-not (Wait-Log $log 'recording-started' 90)) { Get-Content $log -ErrorAction SilentlyContinue; throw 'The recording to cut short did not start' }
          Start-Sleep -Seconds 12
          Get-Process ffmpeg -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Content $log
          $cut = Get-ChildItem $folder -Filter *.mp4 | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $cut) { throw 'The cut-short recording is missing' }
          "Cut short: $($cut.Name), $($cut.Length) bytes"
          # The next launch tidies it into a normal MP4 and says how long it is; the same launch runs Check everything once.
          $log = Join-Path $env:EVIDENCE 'status-recovery.log'
          $env:JAYSNR_STATUS_LOG = $log
          Remove-Item Env:JAYSNR_TEST_RECORD
          $env:JAYSNR_TEST_PREFLIGHT = '1'
          $app = Start-Process $exe -PassThru
          $recovered = Wait-Log $log 'recording-recovered' 120
          $checked = Wait-Log $log 'preflight-result' 90
          Save-Screen 'check.png'
          $running = -not $app.HasExited
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Content $log
          if (-not $running) { throw 'JaySnr closed by itself after the crash' }
          if (-not $recovered) { throw 'The cut-short recording was not recovered' }
          if (-not $checked) { 'Check everything did not finish in time (not a failure of this step)' }
          $line = Select-String -Path $log -Pattern 'recording-recovered' | Select-Object -Last 1
          if ($line.Line -notmatch '\((\d+\.\d) s\)' -or [double]$Matches[1] -le 0) { throw "The recovered length is missing: $($line.Line)" }
          if (-not (Test-Path $cut.FullName)) { throw 'The recovered recording is missing' }
          Copy-Item $cut.FullName (Join-Path $env:EVIDENCE 'recovered.mp4')
          & $ffmpeg -hide_banner -i $cut.FullName 2>&1 | Select-String 'Duration|Stream' | Out-File (Join-Path $env:EVIDENCE 'recovered.txt')
          Get-Content (Join-Path $env:EVIDENCE 'recovered.txt')
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: JaySnr-windows
          path: dist/windows/JaySnr-windows.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: evidence
