# JaySnr for Windows, built and checked on a real Windows machine in the public repository Narikia1/jaysnr-apps.
# It builds a given commit of the private Narikia1/jaysnr (read with a read-only deploy key), installs the result,
# runs it, and uploads the installer and the evidence. It publishes nothing.
name: Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of Narikia1/jaysnr to build
        required: true

permissions:
  contents: read

concurrency:
  group: windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      EVIDENCE: ${{ github.workspace }}\evidence
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Narikia1/jaysnr
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.JAYSNR_SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generated files are current, and nothing is hardcoded
        run: |
          node scripts/generate.mjs --check
          node scripts/check-hygiene.mjs

      - name: The shared engine as a DLL
        run: cargo build --release --manifest-path engine/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Publish
        run: dotnet publish apps/windows/JaySnr/JaySnr.csproj -r win-x64 -c Release --self-contained

      - name: Keep a copy of ffmpeg, because its dated build is removed after a few weeks
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-pin
          key: ffmpeg-${{ hashFiles('apps/windows/scripts/fetch-ffmpeg.mjs') }}

      - name: Fetch the pinned LGPL ffmpeg
        shell: pwsh
        run: |
          node apps/windows/scripts/fetch-ffmpeg.mjs --out dist/windows/publish --cache "$env:RUNNER_TEMP\ffmpeg-pin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/windows/publish/ffmpeg/ffmpeg.exe)) { throw 'ffmpeg.exe was not fetched' }
          if (-not (Test-Path dist/windows/publish/jaysnr_engine.dll)) { throw 'jaysnr_engine.dll is missing' }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          node apps/windows/scripts/generate-installer.mjs
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -First 1
          & $iscc.FullName apps\windows\installer\jaysnr.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\windows\JaySnr-windows.exe | Format-List FullName, Length

      - name: Install, run and keep the evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:EVIDENCE | Out-Null
          Start-Process dist\windows\JaySnr-windows.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\JaySnr\JaySnr.exe'
          if (-not (Test-Path $exe)) { throw 'JaySnr.exe was not installed' }
          $env:JAYSNR_STATUS_LOG = Join-Path $env:EVIDENCE 'status.log'
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $shot.Save((Join-Path $env:EVIDENCE 'studio.png'))
          $running = -not $app.HasExited
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Content $env:JAYSNR_STATUS_LOG -ErrorAction SilentlyContinue
          if (-not $running) { throw 'JaySnr closed by itself' }

      - uses: actions/upload-artifact@v4
        with:
          name: JaySnr-windows
          path: dist/windows/JaySnr-windows.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: evidence
